services:
  ocr:
    build:
      context: .
      dockerfile: ocr/Dockerfile
    networks:
      - app-net
    volumes:
      # Drop images here for the OCR service to process
      - ./ocr/capture:/ocr/capture
      # Resulting JSON files appear here
      - ./ocr/output:/ocr/output
    environment:
      - OCR_CAPTURE_DIR=/ocr/capture
      - OCR_OUTPUT_DIR=/ocr/output
      - OCR_DET_MODEL_DIR=/models/ch_PP-OCRv4_det_infer
      - OCR_REC_MODEL_DIR=/models/ch_PP-OCRv4_rec_infer
      - OCR_CLS_MODEL_DIR=
      - OCR_REC_CHAR_DICT=/models/ppocr_keys_v1.txt
      - OCR_POLL_INTERVAL_MS=500
      - OCR_USE_GPU=0
    restart: unless-stopped

  translate:
    build:
      context: .
      dockerfile: translate/Dockerfile
    stdin_open: true
    tty: true
    networks:
      - app-net
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    volumes:
      - gcloud-config:/root/.config/gcloud
    command: |
      bash -c "
        echo 'Fetching access token...' &&
        GCP_ACCESS_TOKEN=$$(gcloud auth application-default print-access-token) translate
      "
    healthcheck:
      test: >
        bash -c "
          curl \
            -H \"Authorization: Bearer $$(gcloud auth application-default print-access-token)\" \
            -H \"x-goog-user-project: $$GCP_PROJECT_ID\" \
            -H \"Content-Type: application/json\" \
            https://translation.googleapis.com/language/translate/v2 \
            -d '{\"q\":\"Hello\",\"target\":\"es\"}'
        "
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  translate-login:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli
    networks:
      - app-net
    volumes:
      - gcloud-config:/root/.config/gcloud
    stdin_open: true
    tty: true
    command: gcloud auth application-default login

  tts:
    build:
      context: .
      dockerfile: tts/Dockerfile
    stdin_open: true
    tty: true
    networks:
      - app-net
    volumes:
      # Bind-mount the models directory — populate before first run (see tts/README.md)
      - ./tts/models:/models:ro
      # Output WAV files land here on the host
      - ./tts/output:/output
    environment:
      - SHERPA_VITS_MODEL=/models/vits-piper-zh_CN-huayan-medium/zh_CN-huayan-medium.onnx
      - SHERPA_TOKENS=/models/vits-piper-zh_CN-huayan-medium/tokens.txt
      - SHERPA_LEXICON=
      - SHERPA_DATA_DIR=/models/vits-piper-zh_CN-huayan-medium/espeak-ng-data
      - SHERPA_SPEED=1.0
      - SHERPA_SPEAKER_ID=0

networks:
  app-net:
    driver: bridge

volumes:
  gcloud-config: